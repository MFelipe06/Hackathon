---
- name: Installation outils Linux Admin
  apt:
    name:
      - nmap
      - iptables
      - ufw
      - fail2ban
      - rsync
      - cron
      - sysstat
      - lvm2
      - nginx
    state: present
  become: yes

- name: Activer UFW
  ufw:
    state: enabled
    policy: allow
  become: yes

- name: Activer fail2ban
  service:
    name: fail2ban
    state: started
    enabled: yes
  become: yes

- name: Créer un fichier de bienvenue Linux Admin
  copy:
    content: |
      =====================================
      Cours : Administration Linux
      Geneva Institute of Technology
      =====================================
      Outils installés : nmap, ufw, fail2ban, nginx, lvm2
    dest: /home/ubuntu/cours/README.txt
    owner: ubuntu
  become: yes
