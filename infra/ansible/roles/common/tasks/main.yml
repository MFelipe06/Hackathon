---
- name: Mise à jour des paquets
  apt:
    update_cache: yes
    upgrade: yes
  become: yes

- name: Installation des paquets de base
  apt:
    name:
      - curl
      - git
      - vim
      - htop
      - net-tools
      - tree
      - unzip
      - wget
    state: present
  become: yes

- name: Désactiver l'authentification par mot de passe SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
  become: yes
  notify: restart ssh

- name: Créer le dossier de travail étudiant
  file:
    path: /home/ubuntu/cours
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes
