---
- name: Installation Node.js 20
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    apt-get install -y nodejs
  become: yes

- name: Installation outils Dev Web
  apt:
    name:
      - nginx
      - python3
      - python3-pip
      - docker.io
    state: present
  become: yes

- name: Installer Docker Compose
  shell: |
    curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64" \
      -o /usr/local/bin/docker-compose
    chmod +x /usr/local/bin/docker-compose
  become: yes

- name: Ajouter ubuntu au groupe docker
  user:
    name: ubuntu
    groups: docker
    append: yes
  become: yes

- name: Créer un fichier de bienvenue Dev Web
  copy:
    content: |
      =====================================
      Cours : Développement Web
      Geneva Institute of Technology
      =====================================
      Outils installés : Node.js 20, npm, nginx, Docker, Docker Compose
    dest: /home/ubuntu/cours/README.txt
    owner: ubuntu
  become: yes
